modules:
  jira:issuePanel:
    - key: jiraviewlink-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: JiraViewLink
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/dd5a285b-2c37-4c33-a15c-1e86ea1e810d
